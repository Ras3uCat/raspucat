<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BingeQuest</title>
  <script>
    const p = new URLSearchParams(window.location.search);
    const u = p.get('u'), id = p.get('id');
    const qs = u ? 'u=' + u : id ? 'id=' + id : '';
    window.location.href = 'bingequest://profile?' + qs;
    setTimeout(function () {
      const ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua)) {
        window.location.href = 'https://apps.apple.com/app/id6759207637';
      } else if (/Android/.test(ua)) {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.ras3ucat.binge_quest';
      } else {
        document.getElementById('s').style.display = 'block';
      }
    }, 1500);
  </script>
</head>
<body>
  <p>Opening BingeQuest...</p>
  <p id="s" style="display:none">
    Get BingeQuest on
    <a href="https://apps.apple.com/app/id6759207637">iOS</a> or
    <a href="https://play.google.com/store/apps/details?id=com.ras3ucat.binge_quest">Android</a>.
  </p>
</body>
</html>
