<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BingeQuest</title>
  <script>
    const p = new URLSearchParams(window.location.search);
    const type = p.get('type') || 'movie';
    const id = p.get('id') || '';
    window.location.href = 'bingequest://content?type=' + type + '&id=' + id;
    setTimeout(function () {
      window.location.href = 'https://www.themoviedb.org/' + type + '/' + id;
    }, 1500);
  </script>
</head>
<body>
  <p>Opening BingeQuest...</p>
</body>
</html>
