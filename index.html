  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <script>
    // GitHub Pages SPA: restores the path encoded by 404.html before Flutter boots.
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        });
        window.history.replaceState(null, null,
          decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
        );
      }
    }(window.location));
  </script>

  <meta charset="UTF-8">

<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    let _stripe = null;
    let _elements = null;

    function initStripePayment(publishableKey, clientSecret) {
      _stripe = Stripe(publishableKey);
      const appearance = {
        theme: 'night',
        variables: {
          colorPrimary: '#58E3EF',
          colorBackground: '#03091a',
          colorText: '#ffffff',
          colorDanger: '#ff4d4d',
          borderRadius: '8px',
          fontFamily: 'system-ui, sans-serif',
        },
      };
      _elements = _stripe.elements({ clientSecret, appearance });
      const paymentElement = _elements.create('payment', {
        fields: {
          billingDetails: {
            address: { country: 'never', postalCode: 'never' },
          },
        },
        wallets: {
          cashapp: 'never',
          link: 'never',
        },
      });
      paymentElement.mount('#stripe-payment-element');
    }

    async function confirmStripePayment() {
      try {
        const result = await _stripe.confirmPayment({
          elements: _elements,
          redirect: 'if_required',
        });
        return result.error?.message ?? '';
      } catch (e) {
        return e.message || 'An unexpected error occurred. Please try again.';
      }
    }

    async function stripeConfirmCardPayment(publishableKey, clientSecret, paymentMethodId) {
      try {
        if (!_stripe) {
          _stripe = Stripe(publishableKey);
        }
        const result = await _stripe.confirmCardPayment(clientSecret, {
          payment_method: paymentMethodId,
        });
        return result.error?.message ?? '';
      } catch (e) {
        return e.message || 'Payment failed. Please try again.';
      }
    }
  </script>
